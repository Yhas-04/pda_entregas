<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entregador PDA</title>
<link rel="stylesheet" href="./css/style.css"></head><body>
<main class="stage" aria-label="Área do mapa do jogo">
 <canvas id="cv"></canvas>
</main>
<div class="bar">
 <button id="rst">↺ Reiniciar</button>
 <button id="mR" class="on" title="Segue o autômato à risca: transição inexistente rejeita a entrada">Modo Restrito PDA</button>
 <button id="mS" title="Passa por qualquer ponto; só os pontos com transição válida (brilhando) fazem efeito">Modo Livre</button>
<input id="inp" placeholder="Ex.: aAPbBmdGcCmDE" autocomplete="off" spellcheck="false">
<div style="display: flex; flex-wrap: wrap; gap: 8px; width: 100%;">
    <input id="msg" class="msg" value="EX ACEITOS: aAPbBmdGcCmDE - aAPbBmdGcCEDm - aAPbBEdGcCmDm" readonly>
    <input id="msg" class="msg" value="EX REJEITADOS: aAPbBmdGcCmD - aAPbBmdGcCmED - BDmBEdGcCmDm" readonly>
    <button id="run">▶ Inserir sequência</button>
</div>
</div>
<script src="./js/main.js" defer></script></body></html>
