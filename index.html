<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entregador PDA</title>
<link rel="stylesheet" href="./css/style.css"></head><body>
<main class="stage" aria-label="Área do mapa do jogo">
 <canvas id="cv"></canvas>
</main>
<div class="bar">
 <button id="rst">↺ Reiniciar</button>
 <button id="mR" class="on" title="Segue o autômato à risca: transição inexistente rejeita a entrada">Modo PDA</button>
 <button id="mS" title="Passa por qualquer ponto; só os pontos com transição válida (brilhando) fazem efeito">Modo Livre</button>
 <input id="inp" placeholder="a A P b B E d G c C m D m" autocomplete="off" spellcheck="false">
 <button id="run">▶ Inserir sequência</button>
 <section class="stats-row" aria-live="polite" aria-label="Estatísticas de sequências aceitas">
  <strong id="accepted-count">Carregando sequências aceitas…</strong>
  <span id="accepted-list" class="accepted-list"></span>
 </section>
</div>
<script src="./js/main.js" defer></script></body></html>
